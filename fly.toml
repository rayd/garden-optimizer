# fly.toml app configuration file generated for anth-takehome-garden-optimizer on 2026-09-11T13:15:51-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'anth-takehome-garden-optimizer'
primary_region = 'iad'

[env]
  LOG_LEVEL = 'info'
  POOL_SIZE = '10'
  PORT=8080

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 1000
    soft_limit = 1000

[[vm]]
  memory = '1gb'
  cpus = 1
  memory_mb = 1024